<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purrfect Day!</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <h1>Make your cat happy!</h1>
    <div class="room">
        <div class="pou"><img src="./assets/cat.png" alt="cat" id="cat"></div>
    </div>
    <div class="stats">
        <div class="stat"><label>Hunger</label><div class="bar"><div class="progress" id="hunger-bar"></div></div></div>
        <div class="stat"><label>Happiness</label><div class="bar"><div class="progress" id="happiness-bar"></div></div></div>
        <div class="stat"><label>Health</label><div class="bar"><div class="progress" id="health-bar"></div></div></div>
        <div class="stat"><label>Energy</label><div class="bar"><div class="progress" id="energy-bar"></div></div></div>
        <div class="stat"><label>Cleanness</label><div class="bar"><div class="progress" id="cleanness"></div></div></div>
    </div>
    <div class="actions">
        <button onclick="interactWithCat('feed')">Feed</button>
        <button onclick="interactWithCat('clean')">Clean</button>
        <button onclick="interactWithCat('play')">Play</button>

    </div>
    <script src="script.js"></script>
</body>
</html>
